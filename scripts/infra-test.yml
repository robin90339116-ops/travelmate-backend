services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: validation-only
      MYSQL_DATABASE: travelmate
      MYSQL_USER: travelmate
      MYSQL_PASSWORD: validation-only
    ports: ["127.0.0.1:23306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pvalidation-only"]
      interval: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:26379:6379"]
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: travelmate
      RABBITMQ_DEFAULT_PASS: validation-only
    ports: ["127.0.0.1:25672:5672", "127.0.0.1:25673:15672"]
